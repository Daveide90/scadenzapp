name: scadenzapp
description: "Gestione scadenze farmaci per operatori sanitari"
publish_to: 'none'
version: 1.4.3+13

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.3
  google_mlkit_text_recognition: ^0.14.0
  sqflite_sqlcipher: ^3.1.0+1
  flutter_secure_storage: ^9.2.4
  path: ^1.8.0
  provider: ^6.1.1
  intl: ^0.19.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.2
  share_plus: ^7.2.1
  encrypt: ^5.0.3
  crypto: ^3.0.3
  pointycastle: ^3.9.1
  local_auth: ^2.3.0
  file_picker: ^11.0.2
  pdf: ^3.12.0
  flutter_email_sender: ^7.0.0
  flutter_timezone: ^5.1.0
  google_mlkit_barcode_scanning: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.4.5

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#055029"
  adaptive_icon_foreground: "assets/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/aifa_catalog.db.gz
    - assets/illustrazioni/
    - assets/fonts/
    - assets/licenses/
